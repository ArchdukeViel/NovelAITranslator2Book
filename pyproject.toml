[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-ai"
version = "0.1.0"
description = "Web-based Japanese novel crawling, translation, editing, and reader platform."
authors = [{ name = "ArchdukeViel" }]
readme = "readme.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-or-later" }

dependencies = [
  "argon2-cffi>=25.1.0",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "pydantic>=2.13.5",
  "pydantic-settings>=2.15.0",
  "python-dotenv>=1.2.3",
  "httpx>=0.28.1",
  "beautifulsoup4>=4.15.0",
  "lxml>=6.1.2",
  "cryptography>=50.0.1",
  "croniter>=6.2.4",
  "email-validator>=2.3.0",
  "google-genai>=2.20.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=2.20.0"]
test = [
  "httpx2>=2.12.0",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-xdist>=3.8.0",
  "aiosqlite>=0.22.1",
  "hypothesis>=6.167.1",
]
db = ["sqlalchemy>=2.0.52", "alembic>=1.19.1", "psycopg[binary]>=3.3.4"]
worker = ["rq>=2.12.0", "redis>=8.1.0"]
auth = ["itsdangerous>=2.2.0"]
dev = [
  "aiosqlite>=0.22.1",
  "cryptography>=50.0.1",
  "croniter>=6.2.4",
  "google-genai>=2.20.0",
  "hypothesis>=6.167.1",
  "httpx2>=2.12.0",
  "itsdangerous>=2.2.0",
  "pip-tools>=7.6.1",
  "pyright[nodejs]>=1.1.411",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.5",
  "sqlalchemy>=2.0.52",
  "alembic>=1.19.1",
  "psycopg[binary]>=3.3.4",
  "rq>=2.12.0",
  "redis>=8.1.0",
  "fakeredis>=2.37.0",
  "pre-commit>=4.6.2",
  "pyasn1>=0.6.4",
]

[project.urls]
# homepage = "https://example.com"
# repository = "https://example.com/novel-ai"

[tool.setuptools.packages.find]
where = ["backend/src"]

[project.scripts]
novelaibook = "novelai.runtime.cli:main"
novelai = "novelai.__main__:main"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-p no:cacheprovider"
pythonpath = [".", "backend/src", "backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
tmp_path_retention_policy = "none"
markers = [
  "e2e: end-to-end integration tests (full pipeline, slower, requires fixtures)",
  "integration: integration tests against external services (R2 gateway, Redis, etc.)",
  "slow: tests that require database, network, or are particularly slow",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "I",     # isort
  "UP",    # pyupgrade
  "B",     # flake8-bugbear
  "SIM",   # flake8-simplify
  "RUF",   # Ruff-specific rules
  "ASYNC", # flake8-async
]
ignore = [
  "E501",     # line too long (handled by formatter)
  "B008",     # mutable default arg (used intentionally in CLI helpers)
  "B023",     # loop variable binding
  "RUF001",   # ambiguous unicode (intentional Japanese text in tests)
  "RUF012",   # mutable class attribute (used in dataclass-style patterns)
  "SIM102",   # nested if (readability preference)
  "SIM108",   # ternary operator (readability preference)
  "ASYNC109", # Async function definition with a `timeout` parameter (http client interface compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["novelai"]
