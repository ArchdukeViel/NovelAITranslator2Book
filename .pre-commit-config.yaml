repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

# Note: GitGuardian (ggshield) is intentionally not in this pre-commit config.
# Run it manually or via the global git hook:
#   python -m ggshield secret scan pre-commit
# or configure it as a GitHub Action. Adding it here caused environment
# isolation issues with missing transitive dependencies on this machine.
