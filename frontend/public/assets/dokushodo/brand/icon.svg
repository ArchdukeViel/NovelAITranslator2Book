<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="lanternGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E23E1D"/>
      <stop offset="100%" stop-color="#C22F13"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
  </defs>

  <!-- Background circle (Plum #1B141F) -->
  <rect width="512" height="512" rx="128" fill="#1B141F"/>

  <!-- Outer Lantern Frame -->
  <path d="M 256 70 C 230 70, 220 90, 220 100 L 292 100 C 292 90, 282 70, 256 70 Z" fill="#2C2233"/>
  <rect x="236" y="50" width="40" height="20" rx="6" fill="#2C2233"/>
  <path d="M 256 25 A 15 15 0 0 0 256 55 A 15 15 0 0 0 256 25" fill="none" stroke="#2C2233" stroke-width="8"/>

  <!-- Lantern Main Body (Pinched curve) -->
  <path d="M 220 100 C 150 180, 150 330, 220 410 L 292 410 C 362 330, 362 180, 292 100 Z" fill="url(#lanternGrad)"/>

  <!-- Inner Soft Glow Window -->
  <path d="M 235 125 C 185 190, 185 320, 235 385 L 277 385 C 327 320, 327 190, 277 125 Z" fill="url(#glowGrad)" opacity="0.95"/>

  <!-- Kanji Kanji Accent / Book Motif (読) -->
  <path d="M 236 180 H 276 M 256 180 V 330 M 230 220 H 282 M 230 260 H 282 M 236 300 H 276" stroke="#C22F13" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Lantern Base & Tassel -->
  <path d="M 220 410 C 220 420, 230 435, 256 435 C 282 435, 292 420, 292 410 Z" fill="#2C2233"/>
  <rect x="251" y="435" width="10" height="45" rx="3" fill="#E23E1D"/>
  <circle cx="256" cy="485" r="8" fill="#E23E1D"/>
</svg>
