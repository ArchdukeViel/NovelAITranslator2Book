name: S3 Integration

on:
  schedule:
    # Weekly real-provider acceptance run against an in-job MinIO server.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-integration
  cancel-in-progress: false

jobs:
  minio-s3-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra documents --extra gemini --extra dev
          --extra test --extra s3 --extra auth

      - name: Start MinIO container
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

      - name: Wait for MinIO readiness
        env:
          TEST_S3_ENDPOINT: http://localhost:9000
        run: |
          uv run --locked python - <<'PY'
          import os
          import time
          import urllib.request

          endpoint = os.environ["TEST_S3_ENDPOINT"]
          deadline = time.monotonic() + 120
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(f"{endpoint}/minio/health/live", timeout=5) as response:
                      if response.status == 200:
                          print("MinIO is ready.")
                          raise SystemExit(0)
              except Exception:
                  time.sleep(2)
          raise SystemExit("MinIO did not become ready in time")
          PY

      - name: Create test bucket
        env:
          TEST_S3_ENDPOINT: http://localhost:9000
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_SECRET_KEY: minioadmin
          TEST_S3_BUCKET: novelai-test
        run: |
          uv run --locked python - <<'PY'
          import os

          import boto3

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["TEST_S3_ENDPOINT"],
              aws_access_key_id=os.environ["TEST_S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["TEST_S3_SECRET_KEY"],
              region_name="us-east-1",
          )
          s3.create_bucket(Bucket=os.environ["TEST_S3_BUCKET"])
          print(f"Bucket {os.environ['TEST_S3_BUCKET']!r} created.")
          PY

      - name: Run real S3 integration tests
        env:
          TEST_S3_ENDPOINT: http://localhost:9000
          TEST_S3_ACCESS_KEY: minioadmin
          TEST_S3_SECRET_KEY: minioadmin
          TEST_S3_BUCKET: novelai-test
          TEST_S3_REGION: us-east-1
        run: >-
          uv run --locked pytest backend/tests/integration/test_s3_integration.py
          -m integration --tb=short -q
