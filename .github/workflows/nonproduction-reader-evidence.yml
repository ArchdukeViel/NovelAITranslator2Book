name: Non-production Reader Capacity Evidence

on:
  workflow_dispatch:
    inputs:
      confirm_non_production:
        description: "Confirm disposable testdatabase=dokushodo, test R2 buckets, and an ephemeral Cloudflare quick tunnel only"
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: reader-capacity-nonproduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-reader-capacity:
    if: ${{ inputs.confirm_non_production == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    environment: staging
    env:
      COMPOSE_PROJECT: reader-capacity-test-${{ github.run_id }}
      COMPOSE_FILE: deploy/compose.yml
      CLOUD_FLARED_CONTAINER: reader-capacity-test-${{ github.run_id }}-cloudflared
      CLOUDFLARED_IMAGE: cloudflare/cloudflared:2026.8.0@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
      MANAGED_DATABASE_TEST_URL: ${{ secrets.MANAGED_DATABASE_TEST_URL }}
      TEST_R2_GATEWAY_URL: ${{ secrets.TEST_R2_GATEWAY_URL }}
      TEST_R2_APP_CLIENT_ID: ${{ secrets.TEST_R2_APP_CLIENT_ID }}
      TEST_R2_APP_CLIENT_SECRET: ${{ secrets.TEST_R2_APP_CLIENT_SECRET }}
      TEST_R2_RECOVERY_CLIENT_ID: ${{ secrets.TEST_R2_RECOVERY_CLIENT_ID }}
      TEST_R2_RECOVERY_CLIENT_SECRET: ${{ secrets.TEST_R2_RECOVERY_CLIENT_SECRET }}
      TEST_R2_APPLICATION_BUCKET: test-dokushodo
      TEST_R2_BACKUP_BUCKET: test-dokushodo-backup

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install locked test tooling
        run: >-
          uv sync --locked --extra gemini --extra dev --extra test
          --extra auth

      - name: Prepare guarded disposable runtime environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          missing_names=()
          [[ -n "${MANAGED_DATABASE_TEST_URL:-}" ]] || missing_names+=("MANAGED_DATABASE_TEST_URL")
          [[ -n "${TEST_R2_GATEWAY_URL:-}" ]] || missing_names+=("TEST_R2_GATEWAY_URL")
          [[ -n "${TEST_R2_APP_CLIENT_ID:-}" ]] || missing_names+=("TEST_R2_APP_CLIENT_ID")
          [[ -n "${TEST_R2_APP_CLIENT_SECRET:-}" ]] || missing_names+=("TEST_R2_APP_CLIENT_SECRET")
          [[ -n "${TEST_R2_RECOVERY_CLIENT_ID:-}" ]] || missing_names+=("TEST_R2_RECOVERY_CLIENT_ID")
          [[ -n "${TEST_R2_RECOVERY_CLIENT_SECRET:-}" ]] || missing_names+=("TEST_R2_RECOVERY_CLIENT_SECRET")
          [[ -n "${TEST_R2_APPLICATION_BUCKET:-}" ]] || missing_names+=("TEST_R2_APPLICATION_BUCKET")
          [[ -n "${TEST_R2_BACKUP_BUCKET:-}" ]] || missing_names+=("TEST_R2_BACKUP_BUCKET")
          if ((${#missing_names[@]} > 0)); then
            mkdir -p artifacts/operations/reader-capacity-follow-up
            printf '{"schema_version":1,"status":"blocked","missing_names":"%s","secrets_emitted":false}\n' \
              "${missing_names[*]}" > artifacts/operations/reader-capacity-follow-up/runtime-secret-preflight.json
            echo "::error::The disposable managed database/R2 test inputs are unavailable; missing names: ${missing_names[*]}"
            exit 1
          fi
          if [[ "$TEST_R2_GATEWAY_URL" != https://* ]]; then
            echo "::error::The test R2 gateway must use HTTPS."
            exit 1
          fi
          if [[ "$TEST_R2_APPLICATION_BUCKET" != "test-dokushodo" ||
                "$TEST_R2_BACKUP_BUCKET" != "test-dokushodo-backup" ]]; then
            echo "::error::The reader fixture requires the dedicated test-dokushodo application bucket."
            exit 1
          fi

          database_url="$MANAGED_DATABASE_TEST_URL"
          case "$database_url" in
            postgres://*) database_url="postgresql+psycopg://${database_url#postgres://}" ;;
            postgresql://*) database_url="postgresql+psycopg://${database_url#postgresql://}" ;;
            postgresql+psycopg://*) ;;
            *) echo "::error::The managed test database URL uses an unsupported scheme."; exit 1 ;;
          esac

          session_secret="$(openssl rand -hex 32)"
          owner_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$owner_secret"

          mkdir -p artifacts/operations/reader-capacity-follow-up "$RUNNER_TEMP/reader-capacity-runtime"
          # The application images run as the non-root novelai user. This is an
          # ephemeral runner directory, so make only this disposable mount
          # writable without weakening permissions on the checkout or secrets.
          chmod 0777 "$RUNNER_TEMP/reader-capacity-runtime"
          {
            printf 'ENV=staging\n'
            printf 'DATABASE_URL=%s\n' "$database_url"
            printf 'MIGRATION_DATABASE_URL=%s\n' "$database_url"
            printf 'DB_CONNECTION_MODE=session\n'
            printf 'DB_POOL_SIZE=10\nDB_MAX_OVERFLOW=4\nDB_POOL_PROCESS_COUNT=2\nDB_CONNECTION_RESERVE=2\nDB_CONNECTION_BUDGET=32\n'
            printf 'DB_SSL_MODE=require\nDB_CONNECT_TIMEOUT_SECONDS=15\n'
            printf 'R2_BUCKET=%s\n' "$TEST_R2_APPLICATION_BUCKET"
            printf 'R2_GATEWAY_URL=%s\nR2_GATEWAY_CLIENT_ID=%s\nR2_GATEWAY_CLIENT_SECRET=%s\n' \
              "$TEST_R2_GATEWAY_URL" "$TEST_R2_APP_CLIENT_ID" "$TEST_R2_APP_CLIENT_SECRET"
            printf 'R2_BACKUP_ENABLED=false\nR2_BACKUP_BUCKET=test-dokushodo-backup\n'
            printf 'R2_RECOVERY_GATEWAY_URL=%s\nR2_RECOVERY_CLIENT_ID=%s\nR2_RECOVERY_CLIENT_SECRET=%s\n' \
              "$TEST_R2_GATEWAY_URL" "$TEST_R2_RECOVERY_CLIENT_ID" "$TEST_R2_RECOVERY_CLIENT_SECRET"
            printf 'SESSION_SECRET_KEY=%s\nOWNER_BOOTSTRAP_SECRET=%s\n' "$session_secret" "$owner_secret"
            printf 'PUBLIC_FRONTEND_URL=https://reader-capacity-test.invalid\n'
            printf 'SITE_DOMAIN=localhost\nPUBLIC_BIND_ADDRESS=127.0.0.1\nPUBLIC_HTTP_PORT=18080\n'
            printf 'RUNTIME_HOST_DIR=%s\n' "$RUNNER_TEMP/reader-capacity-runtime"
            printf 'ALLOWED_HOSTS=\nWEB_CORS_ORIGINS=\nAUTH_EMAIL_DELIVERY_MODE=noop\n'
            printf 'WEB_RATE_LIMITER_BACKEND=redis\nJOB_WORKER_ENABLED=false\nANALYTICS_ENABLED=false\n'
            printf 'TRANSLATION_PERSISTENCE_EXPANSION_ENABLED=false\n'
            printf 'READER_CAPACITY_FIXTURE_TARGET=non-production\n'
            printf 'ADMIN_IMAGE=novelai-admin:capacity\nREADER_IMAGE=novelai-reader:capacity\nFRONTEND_IMAGE=novelai-frontend:capacity\n'
          } > deploy/.env

      - name: Build isolated application images
        shell: bash
        run: |
          set -euo pipefail
          docker build --file deploy/admin.Dockerfile --tag novelai-admin:capacity .
          docker build --file deploy/reader.Dockerfile --tag novelai-reader:capacity .
          docker build --file deploy/frontend.Dockerfile --tag novelai-frontend:capacity .

      - name: Apply migrations to the disposable database
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" --profile migration run --rm migrate \
            > "$RUNNER_TEMP/reader-capacity-migrate.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            migration_class="migration_log_unavailable"
            migration_log="$RUNNER_TEMP/reader-capacity-migrate.log"
            if [[ -r "$migration_log" ]]; then
              migration_class="migration_failed_unclassified"
              if grep -Eqi 'password authentication failed|authentication failed|invalid password|role .* does not exist' "$migration_log"; then
                migration_class="database_authentication"
              elif grep -Eqi 'connection refused|could not connect|connection timed out|timeout expired|network is unreachable|temporary failure' "$migration_log"; then
                migration_class="database_connectivity"
              elif grep -Eqi 'permission denied|must be owner|insufficient privilege|not authorized' "$migration_log"; then
                migration_class="database_permission"
              elif grep -Eqi 'ssl|tls|certificate' "$migration_log"; then
                migration_class="database_ssl"
              elif grep -Eqi 'invalid.*dsn|postgresql\+psycopg|driver|unsupported scheme' "$migration_log"; then
                migration_class="database_url_or_driver"
              elif grep -Eqi 'can.t locate revision|no such revision|not a valid revision|alembic' "$migration_log"; then
                migration_class="migration_schema"
              elif grep -Eqi 'docker|compose|service|image|daemon' "$migration_log"; then
                migration_class="compose_runtime"
              fi
            fi
            printf '{"schema_version":"1","status":"migration_failed","error_class":"%s","raw_log_emitted":false}\n' "$migration_class" \
              > artifacts/operations/reader-capacity-follow-up/migration-diagnostic.json
            echo "::error::Disposable database migration failed; sanitized error class: $migration_class"
            exit "$status"
          fi

      - name: Verify protected test R2 gateway identities
        shell: bash
        run: |
          set -euo pipefail

          classify_status() {
            case "$1" in
              200) printf 'http_200' ;;
              401) printf 'unauthorized' ;;
              403) printf 'forbidden' ;;
              000) printf 'transport_error' ;;
              *) printf 'unexpected_http_status' ;;
            esac
          }

          gateway_health_url="${TEST_R2_GATEWAY_URL%/}/v1/health"
          set +e
          app_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            -H "CF-Access-Client-Id: $TEST_R2_APP_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $TEST_R2_APP_CLIENT_SECRET" \
            "$gateway_health_url" \
            2>"$RUNNER_TEMP/reader-capacity-r2-app-health.log")"
          app_exit=$?
          recovery_status="$(curl --silent --show-error --connect-timeout 5 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' \
            -H "CF-Access-Client-Id: $TEST_R2_RECOVERY_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $TEST_R2_RECOVERY_CLIENT_SECRET" \
            "$gateway_health_url" \
            2>"$RUNNER_TEMP/reader-capacity-r2-recovery-health.log")"
          recovery_exit=$?
          set -e

          [[ "$app_exit" -eq 0 ]] || app_status="000"
          [[ "$recovery_exit" -eq 0 ]] || recovery_status="000"
          app_class="$(classify_status "$app_status")"
          recovery_class="$(classify_status "$recovery_status")"
          preflight_status="passed"
          if [[ "$app_class" != "http_200" || "$recovery_class" != "http_200" ]]; then
            preflight_status="blocked"
          fi
          printf '{"schema_version":1,"status":"%s","application_health":"%s","recovery_health":"%s","secrets_emitted":false}\n' \
            "$preflight_status" "$app_class" "$recovery_class" \
            > artifacts/operations/reader-capacity-follow-up/r2-gateway-preflight.json
          if [[ "$preflight_status" != "passed" ]]; then
            echo "::error::Protected test R2 gateway preflight failed; HTTP classes: application=$app_class recovery=$recovery_class"
            exit 1
          fi

      - name: Seed the explicit synthetic reader fixture
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" run --rm --no-deps backend \
            python -m novelai.scripts.seed_reader_capacity_fixture seed \
            > artifacts/operations/reader-capacity-follow-up/fixture-seed.json \
            2> "$RUNNER_TEMP/reader-capacity-seed.log"
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            seed_class="seed_failed_unclassified"
            seed_log="$RUNNER_TEMP/reader-capacity-seed.log"
            if [[ -r "$seed_log" ]]; then
              if grep -Eqi '401|403|unauthorized|forbidden|cf-access|access identity|r2 gateway' "$seed_log"; then
                seed_class="r2_gateway_authentication"
              elif grep -Eqi 'r2|object storage|http_error|bucket' "$seed_log"; then
                seed_class="r2_gateway_request"
              elif grep -Eqi 'password authentication failed|authentication failed|invalid password|role .* does not exist' "$seed_log"; then
                seed_class="database_authentication"
              elif grep -Eqi 'unique constraint|duplicate key|already exists|collision|different database id' "$seed_log"; then
                seed_class="fixture_collision"
              elif grep -Eqi 'connection refused|could not connect|connection timed out|timeout expired|network is unreachable|temporary failure' "$seed_log"; then
                seed_class="database_connectivity"
              elif grep -Eqi 'not configured|must be set|unsupported scheme|ENV=' "$seed_log"; then
                seed_class="runtime_configuration"
              elif grep -Eqi 'no module named|cannot import|modulenotfound' "$seed_log"; then
                seed_class="container_package"
              elif grep -Eqi 'docker|compose|service|image|daemon' "$seed_log"; then
                seed_class="compose_runtime"
              fi
            fi
            printf '{"schema_version":1,"status":"seed_failed","error_class":"%s","raw_log_emitted":false}\n' "$seed_class" \
              > artifacts/operations/reader-capacity-follow-up/fixture-seed-diagnostic.json
            echo "::error::Disposable reader fixture seeding failed; sanitized error class: $seed_class"
            echo "::error::No reader profile was run."
            exit "$status"
          fi

      - name: Start the isolated reader runtime
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" up -d --wait --wait-timeout 180 \
            redis backend reader frontend caddy

      - name: Capture sanitized runtime startup diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/operations/reader-capacity-follow-up
          ps_text="$(docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" ps --format json 2>/dev/null || true)"
          reader_state="unavailable"
          if [[ "$ps_text" =~ unhealthy ]]; then reader_state="unhealthy"; fi
          if [[ "$ps_text" =~ running && ! "$ps_text" =~ unhealthy ]]; then reader_state="running_or_starting"; fi
          if [[ "$ps_text" =~ exited ]]; then reader_state="exited"; fi

          container_id="$(docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" ps -q reader 2>/dev/null || true)"
          exit_code="unknown"
          if [[ -n "$container_id" ]]; then
            exit_code="$(docker inspect --format '{{.State.ExitCode}}' "$container_id" 2>/dev/null || true)"
            [[ -n "$exit_code" ]] || exit_code="unknown"
          fi

          validation=false
          database=false
          r2=false
          redis=false
          traceback=false
          permission=false
          oom=false
          port=false
          health=false
          while IFS= read -r line; do
            case "$line" in
              *ValidationError*|*validation*|*pydantic*) validation=true ;;
              *database*|*Database*|*psycopg*|*"connection refused"*) database=true ;;
              *R2*) r2=true ;;
              *Redis*|*redis*) redis=true ;;
              *Traceback*) traceback=true ;;
              *Permission*|*permission*) permission=true ;;
              *OOM*|*oom*|*killed*) oom=true ;;
              *"address already in use"*|*"port is already allocated"*) port=true ;;
              *health*|*Health*) health=true ;;
            esac
          done < <(docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" logs --no-color reader 2>&1 || true)

          markers=""
          for marker in validation database r2 redis traceback permission oom port health; do
            value="${!marker}"
            if [[ "$value" == true ]]; then
              [[ -n "$markers" ]] && markers+=","
              markers+="\"$marker\""
            fi
          done
          if [[ -z "$markers" ]]; then markers='"unknown_startup_failure"'; fi
          printf '{"schema_version":1,"status":"startup_failure","reader_state":"%s","reader_exit_code":"%s","error_classes":[%s]}\n' \
            "$reader_state" "$exit_code" "$markers" \
            > artifacts/operations/reader-capacity-follow-up/startup-diagnostic.json
          echo "::warning::Isolated reader startup diagnostic captured with fixed error classes only."

      - name: Capture the isolated safety baseline
        shell: pwsh
        run: |
          $bytes = [Text.Encoding]::UTF8.GetBytes("test-novel|456")
          $hash = [Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $fixtureId = "fixture-" + (($hash | ForEach-Object { $_.ToString("x2") }) -join "").Substring(0, 16)
          "READER_FIXTURE_BINDING_ID=$fixtureId" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/capacity/run_reader_follow_up_preflight.ps1 `
            -ReadOnly `
            -OutputPath artifacts/operations/reader-capacity-follow-up/baseline.json `
            -SloGateTopology cloudflare_tunnel `
            -FixtureBindingId $fixtureId `
            -ComposeProject $env:COMPOSE_PROJECT `
            -ComposeFile $env:COMPOSE_FILE `
            -ComposeEnvFile deploy/.env

      - name: Start the disposable Cloudflare quick tunnel
        shell: bash
        run: |
          set -euo pipefail
          cloudflare_url=""
          tunnel_ready=false
          for tunnel_attempt in 1 2 3; do
            docker rm --force "$CLOUD_FLARED_CONTAINER" > /dev/null 2>&1 || true
            if ! docker run --detach --name "$CLOUD_FLARED_CONTAINER" --network host \
              "$CLOUDFLARED_IMAGE" tunnel --no-autoupdate \
              --url http://127.0.0.1:18080 --http-host-header localhost \
              > "$RUNNER_TEMP/reader-capacity-cloudflared-id"; then
              echo "::warning::Disposable Cloudflare quick tunnel attempt $tunnel_attempt failed to start."
              continue
            fi

            cloudflare_url=""
            for _ in $(seq 1 60); do
              cloudflare_url="$(docker logs "$CLOUD_FLARED_CONTAINER" 2>&1 \
                | sed -nE 's/.*(https:\/\/[a-z0-9-]+\.trycloudflare\.com).*/\1/p' \
                | head -n 1 || true)"
              if [[ -n "$cloudflare_url" ]]; then break; fi
              sleep 1
            done
            if [[ -z "$cloudflare_url" ]]; then
              echo "::warning::Disposable Cloudflare quick tunnel attempt $tunnel_attempt did not publish a URL."
              continue
            fi

            tunnel_status=""
            for _ in $(seq 1 60); do
              tunnel_status="$(curl --silent --connect-timeout 5 --max-time 15 \
                --output /dev/null --write-out '%{http_code}' \
                "$cloudflare_url/health/live" 2>/dev/null || true)"
              if [[ "$tunnel_status" == "200" ]]; then break; fi
              sleep 1
            done
            if [[ "$tunnel_status" == "200" ]]; then
              tunnel_ready=true
              break
            fi
            echo "::warning::Disposable Cloudflare quick tunnel attempt $tunnel_attempt did not reach the isolated liveness endpoint."
          done
          if [[ "$tunnel_ready" != true ]]; then
            echo "::error::The disposable Cloudflare quick tunnel did not reach the isolated liveness endpoint after bounded retries."
            exit 1
          fi
          echo "Disposable Cloudflare quick tunnel readiness reached HTTP 200."
          printf 'READER_CLOUDFLARE_BASE_URL=%s\n' "$cloudflare_url" >> "$GITHUB_ENV"

      - name: Capture sanitized hosted telemetry boundary
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/capacity/capture_reader_follow_up_telemetry.ps1 `
            -BaselinePath artifacts/operations/reader-capacity-follow-up/baseline.json `
            -OutputPath artifacts/operations/reader-capacity-follow-up/hosted-telemetry.json `
            -Phase pre_remediation `
            -ReaderRunId "reader-${{ github.run_id }}" `
            -Revision "${{ github.sha }}" `
            -Topology cloudflare_tunnel

      - name: Run the bounded Cloudflare reader profile
        shell: pwsh
        run: |
          & pwsh -NoProfile -ExecutionPolicy Bypass -File tools/capacity/run_reader_profile.ps1 `
            -ReadOnly `
            -Profile 1000 `
            -SloGateTopology cloudflare_tunnel `
            -CaddyBaseUrl http://127.0.0.1:18080 `
            -CaddyHostHeader localhost `
            -CloudflareBaseUrl $env:READER_CLOUDFLARE_BASE_URL `
            -NovelSlug test-novel `
            -ChapterId 456 `
            -ColdCacheMode disposable_reader_reset `
            -ColdResetScript tools/capacity/reset_reader_cache.ps1 `
            -ColdResetComposeProject $env:COMPOSE_PROJECT `
            -ColdResetComposeFile $env:COMPOSE_FILE `
            -ColdResetComposeEnvFile deploy/.env `
            -BaselinePath artifacts/operations/reader-capacity-follow-up/baseline.json `
            -ReportDir artifacts/operations/reader-capacity-follow-up/reader-stage-1000 `
            -WarmSamples 50 `
            -ColdSamples 50 `
            -MaxAttemptsPerCell 100 `
            -Concurrency 8 `
            -TimeoutSeconds 20

      - name: Clean the disposable fixture, runtime, and tunnel
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_status=0
          if [[ -f deploy/.env ]]; then
            docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
              --file "$COMPOSE_FILE" run --rm --no-deps backend \
              python -m novelai.scripts.seed_reader_capacity_fixture cleanup \
              > "$RUNNER_TEMP/reader-capacity-cleanup.log" 2>&1
            cleanup_status=$?
          fi
          if [[ "$cleanup_status" -eq 0 ]]; then
            printf '{"schema_version":1,"status":"cleanup_completed","target_class":"isolated_non_production_reader_runtime","operation":"guarded_fixture_and_exact_r2_namespace_cleanup"}\n' \
              > artifacts/operations/reader-capacity-follow-up/fixture-cleanup.json
          else
            cleanup_class="cleanup_failed_unclassified"
            cleanup_log="$RUNNER_TEMP/reader-capacity-cleanup.log"
            if [[ -r "$cleanup_log" ]]; then
              if grep -Eqi '401|403|unauthorized|forbidden|cf-access|access identity|r2 gateway' "$cleanup_log"; then
                cleanup_class="r2_gateway_authentication"
              elif grep -Eqi 'r2|object storage|http_error|bucket' "$cleanup_log"; then
                cleanup_class="r2_gateway_request"
              elif grep -Eqi 'password authentication failed|authentication failed|invalid password|role .* does not exist' "$cleanup_log"; then
                cleanup_class="database_authentication"
              elif grep -Eqi 'connection refused|could not connect|connection timed out|timeout expired|network is unreachable|temporary failure' "$cleanup_log"; then
                cleanup_class="database_connectivity"
              elif grep -Eqi 'not configured|must be set|unsupported scheme|ENV=' "$cleanup_log"; then
                cleanup_class="runtime_configuration"
              elif grep -Eqi 'no module named|cannot import|modulenotfound' "$cleanup_log"; then
                cleanup_class="container_package"
              elif grep -Eqi 'docker|compose|service|image|daemon' "$cleanup_log"; then
                cleanup_class="compose_runtime"
              fi
            fi
            printf '{"schema_version":1,"status":"cleanup_failed","target_class":"isolated_non_production_reader_runtime","operation":"guarded_fixture_and_exact_r2_namespace_cleanup"}\n' \
              > artifacts/operations/reader-capacity-follow-up/fixture-cleanup.json
            printf '{"schema_version":1,"status":"cleanup_failed","error_class":"%s","raw_log_emitted":false}\n' "$cleanup_class" \
              > artifacts/operations/reader-capacity-follow-up/fixture-cleanup-diagnostic.json
            echo "::error::Disposable fixture cleanup failed; sanitized error class: $cleanup_class"
          fi
          docker rm --force "$CLOUD_FLARED_CONTAINER" > "$RUNNER_TEMP/reader-capacity-tunnel-cleanup.log" 2>&1
          docker compose --project-name "$COMPOSE_PROJECT" --env-file deploy/.env \
            --file "$COMPOSE_FILE" down --volumes --remove-orphans \
            > "$RUNNER_TEMP/reader-capacity-compose-cleanup.log" 2>&1
          rm -f deploy/.env
          if [[ "$cleanup_status" -ne 0 ]]; then
            echo "::error::Disposable fixture cleanup failed; review the test bucket before rerunning."
            exit "$cleanup_status"
          fi

      - name: Upload sanitized reader evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nonproduction-reader-evidence-${{ github.run_id }}
          path: artifacts/operations/reader-capacity-follow-up/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
