name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions: {}

concurrency:
  # Cancel superseded PR runs (they only consume runner time), but never
  # cancel branch runs on main/develop: those are the authoritative CI
  # signals that container-publish.yml waits on before publishing images.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path-aware gating for pull requests: each dependent job only runs when
  # its inputs actually changed. Push runs on main/develop stay authoritative
  # and always execute the full matrix.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'requirements*.lock'
            frontend:
              - 'frontend/**'
            docker:
              - 'deploy/**'
              - '.dockerignore'
              - 'readme.md'
            workflow:
              - '.github/workflows/**'

  backend-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra gemini --extra dev
          --extra test --extra auth
      - name: Run canonical pre-commit hooks
        run: uv run --locked pre-commit run --all-files
      - name: Verify pre-commit left a clean checkout
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Pre-commit modified the checkout."
            exit 1
          fi
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright

      - name: Router layer violation check
        run: |
          set -e
          violations=$(grep -rn "^from novelai\.\(db\.models\|storage\.service\|sources\.\)" \
            backend/src/novelai/api/routers/ \
            --exclude="dependencies.py" || true)
          if [ -n "$violations" ]; then
            echo "Layer violations found in routers:"
            echo "$violations"
            exit 1
          fi
          echo "No router layer violations found."

  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    needs: changes
    if: >-
      ${{
        github.event_name == 'push' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      }}
    env:
      ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra gemini --extra dev
          --extra test --extra auth

      - name: Run unit tests
        run: >
          uv run --locked pytest -n 2 --dist loadfile --basetemp=backend/tests/.tmp/pytest-core --tb=short -q -m "not e2e and not slow"
          --ignore=backend/tests/test_admin_glossary_api.py
          --ignore=backend/tests/test_auth.py
          --ignore=backend/tests/test_checkpoint_resume.py
          --ignore=backend/tests/test_document_import_orchestration.py
          --ignore=backend/tests/test_glossary_prompt_injection.py
          --ignore=backend/tests/test_integration.py
          --ignore=backend/tests/test_maintenance_status_service.py
          --ignore=backend/tests/test_novel_lifecycle_integration.py
          --ignore=backend/tests/test_novel_orchestration_service.py
          --ignore=backend/tests/test_notification_event_bus.py
          --ignore=backend/tests/test_notification_persistence_service.py
          --ignore=backend/tests/test_pipeline_stages.py
          --ignore=backend/tests/test_project_layout.py
          --ignore=backend/tests/test_provider_registry.py
          --ignore=backend/tests/test_public_reader_availability.py
          --ignore=backend/tests/test_translation_qa.py
          --ignore=backend/tests/test_user_data_router.py
          --ignore=backend/tests/test_web_api.py

  migration-smoke:
    name: Migration smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    needs: changes
    if: >-
      ${{
        github.event_name == 'push' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      }}

    services:
      postgres:
        image: postgres:18.6@sha256:ae6c78831cbc35fa3a4aaf4d763ddacf6183d6004774cc2dc28b3920410d1d1a
        env:
          POSTGRES_USER: novelai
          POSTGRES_PASSWORD: novelai
          POSTGRES_DB: novelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra gemini --extra dev
          --extra test --extra auth

      - name: Bootstrap Supabase auth signature on vanilla PostgreSQL
        env:
          DATABASE_URL: postgresql://novelai:novelai@localhost:5432/novelai
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          sql = Path("backend/sql/ci_vanilla_postgres_auth_compat.sql").read_text(encoding="utf-8")
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              connection.execute(sql)
          PY

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://novelai:novelai@localhost:5432/novelai
        run: uv run --locked alembic -c alembic.ini upgrade head

  backend-extended:
    name: Backend extended tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: changes
    if: >-
      ${{
        github.event_name == 'push' ||
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: orchestration-and-pipeline
            test_files: >-
              backend/tests/test_novel_orchestration_service.py
              backend/tests/test_pipeline_stages.py
          - shard: web-api-and-auth
            test_files: >-
              backend/tests/test_web_api.py
              backend/tests/test_auth.py
              backend/tests/test_user_data_router.py
              backend/tests/test_admin_glossary_api.py
              backend/tests/test_public_reader_availability.py
          - shard: components-and-lifecycle
            test_files: >-
              backend/tests/test_glossary_prompt_injection.py
              backend/tests/test_provider_registry.py
              backend/tests/test_translation_qa.py
              backend/tests/test_notification_event_bus.py
              backend/tests/test_notification_persistence_service.py
              backend/tests/test_maintenance_status_service.py
              backend/tests/test_project_layout.py
              backend/tests/test_novel_lifecycle_integration.py
              backend/tests/test_checkpoint_resume.py
              backend/tests/test_document_import_orchestration.py
              backend/tests/test_integration.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra gemini --extra dev
          --extra test --extra auth
      - run: >-
          uv run --locked pytest -n 2 --dist loadfile --basetemp=backend/tests/.tmp/pytest-${{ matrix.shard }}
          --tb=short -q ${{ matrix.test_files }}

  frontend-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    needs: changes
    if: >-
      ${{
        github.event_name == 'push' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.workflow == 'true'
      }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docs-gate:
    name: Documentation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra gemini --extra dev
          --extra test --extra auth
      - name: Validate canonical documentation
        run: uv run --locked python tools/docs_check.py --root .

  docker-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    # PRs and develop pushes validate image builds; on main the images are
    # built authoritatively by the Container Publish workflow after
    # CI succeeds, so the non-push duplicate build is skipped there.
    # Validation builds only READ the gha cache (cache-from): exporting
    # cache-to on every PR run re-uploads ~50s of layers and competes with
    # container-publish.yml as a cache producer. container-publish.yml (mode=max) is the single
    # authoritative producer.
    # Path-aware on PRs: only build when an image input changed, but still
    # only after every relevant test job has not failed.
    if: >-
      ${{
        (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop') &&
        !cancelled() &&
        (github.event_name == 'push' ||
         needs.changes.outputs.docker == 'true' ||
         needs.changes.outputs.backend == 'true' ||
         needs.changes.outputs.frontend == 'true' ||
         needs.changes.outputs.workflow == 'true') &&
        needs.backend-lint.result != 'failure' &&
        needs.backend-tests.result != 'failure' &&
        needs.migration-smoke.result != 'failure' &&
        needs.backend-extended.result != 'failure' &&
        needs.frontend-check.result != 'failure' &&
        needs.e2e-tests.result != 'failure' &&
        needs.docs-gate.result != 'failure'
      }}
    needs:
      [
        changes,
        backend-lint,
        backend-tests,
        migration-smoke,
        backend-extended,
        frontend-check,
        e2e-tests,
        docs-gate,
      ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build admin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/admin.Dockerfile
          push: false
          tags: novelai/admin:ci
          cache-from: type=gha,scope=admin

      - name: Build reader image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/reader.Dockerfile
          push: false
          tags: novelai/reader:ci
          cache-from: type=gha,scope=reader

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: false
          tags: novelai/frontend:ci
          cache-from: type=gha,scope=frontend

  e2e-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: changes
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'backend/src/**'
              - 'backend/tests/e2e/**'
              - 'backend/tests/fixtures/e2e/**'
              - 'backend/tests/conftest.py'
              - 'backend/alembic/**'
              - 'backend/sql/**'

      - if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - if: steps.filter.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - if: steps.filter.outputs.relevant == 'true'
        run: >-
          uv sync --locked --extra gemini --extra dev
          --extra test --extra auth

      - if: steps.filter.outputs.relevant == 'true'
        run: >-
          uv run --locked pytest --basetemp=backend/tests/.tmp/pytest-e2e
          -m e2e --tb=short -q
