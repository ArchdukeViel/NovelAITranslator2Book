name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # Cancel superseded PR runs (they only consume runner time), but never
  # cancel branch runs on main/develop: those are the authoritative CI
  # signals that build.yml waits on before publishing images.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra documents --extra gemini --extra dev
          --extra test --extra s3 --extra auth
      - run: uv run --locked ruff check .
      - run: uv run --locked pyright

      - name: Router layer violation check
        run: |
          set -e
          violations=$(grep -rn "^from novelai\.\(db\.models\|storage\.service\|sources\.\)" \
            backend/src/novelai/api/routers/ \
            --exclude="dependencies.py" || true)
          if [ -n "$violations" ]; then
            echo "Layer violations found in routers:"
            echo "$violations"
            exit 1
          fi
          echo "No router layer violations found."

  backend-tests:
    runs-on: ubuntu-latest
    env:
      ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra documents --extra gemini --extra dev
          --extra test --extra s3 --extra auth

      - name: Run unit tests
        run: >
          uv run --locked pytest --basetemp=backend/tests/.tmp/pytest-core --tb=short -q -m "not e2e and not slow"
          --ignore=backend/tests/test_admin_glossary_api.py
          --ignore=backend/tests/test_auth.py
          --ignore=backend/tests/test_checkpoint_resume.py
          --ignore=backend/tests/test_document_import_orchestration.py
          --ignore=backend/tests/test_glossary_prompt_injection.py
          --ignore=backend/tests/test_glossary_sync_bridge.py
          --ignore=backend/tests/test_integration.py
          --ignore=backend/tests/test_malformed_artifact_recovery.py
          --ignore=backend/tests/test_maintenance_status_service.py
          --ignore=backend/tests/test_novel_lifecycle_integration.py
          --ignore=backend/tests/test_novel_orchestration_service.py
          --ignore=backend/tests/test_notification_event_bus.py
          --ignore=backend/tests/test_notification_persistence_service.py
          --ignore=backend/tests/test_pipeline_stages.py
          --ignore=backend/tests/test_project_layout.py
          --ignore=backend/tests/test_provider_registry.py
          --ignore=backend/tests/test_public_reader_availability.py
          --ignore=backend/tests/test_translation_qa.py
          --ignore=backend/tests/test_user_data_router.py
          --ignore=backend/tests/test_web_api.py

  migration-smoke:
    name: Migration smoke test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novelai
          POSTGRES_PASSWORD: novelai
          POSTGRES_DB: novelai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra documents --extra gemini --extra dev
          --extra test --extra s3 --extra auth

      - name: Bootstrap Supabase auth signature on vanilla PostgreSQL
        env:
          DATABASE_URL: postgresql://novelai:novelai@localhost:5432/novelai
        run: |
          uv run --locked python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          sql = Path("backend/sql/ci_vanilla_postgres_auth_compat.sql").read_text(encoding="utf-8")
          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              connection.execute(sql)
          PY

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://novelai:novelai@localhost:5432/novelai
        run: uv run --locked alembic -c alembic.ini upgrade head

  backend-extended:
    name: Backend extended tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: orchestration-and-pipeline
            test_files: >-
              backend/tests/test_novel_orchestration_service.py
              backend/tests/test_pipeline_stages.py
          - shard: web-api-and-auth
            test_files: >-
              backend/tests/test_web_api.py
              backend/tests/test_auth.py
              backend/tests/test_user_data_router.py
          - shard: lifecycle-and-integration
            test_files: >-
              backend/tests/test_novel_lifecycle_integration.py
              backend/tests/test_admin_glossary_api.py
              backend/tests/test_checkpoint_resume.py
              backend/tests/test_document_import_orchestration.py
              backend/tests/test_integration.py
          - shard: components-and-providers
            test_files: >-
              backend/tests/test_glossary_prompt_injection.py
              backend/tests/test_glossary_sync_bridge.py
              backend/tests/test_provider_registry.py
              backend/tests/test_translation_qa.py
              backend/tests/test_notification_event_bus.py
              backend/tests/test_notification_persistence_service.py
              backend/tests/test_maintenance_status_service.py
              backend/tests/test_malformed_artifact_recovery.py
              backend/tests/test_project_layout.py
              backend/tests/test_public_reader_availability.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.12.0"
          enable-cache: true

      - run: >-
          uv sync --locked --extra documents --extra gemini --extra dev
          --extra test --extra s3 --extra auth
      - run: >-
          uv run --locked pytest --basetemp=backend/tests/.tmp/pytest-${{ matrix.shard }}
          --tb=short -q ${{ matrix.test_files }}

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    # PRs and develop pushes validate image builds; on main the images are
    # built authoritatively by the Build and Push workflow (build.yml) after
    # CI succeeds, so the non-push duplicate build is skipped there.
    # Validation builds only READ the gha cache (cache-from): exporting
    # cache-to on every PR run re-uploads ~50s of layers and competes with
    # build.yml as a cache producer. build.yml (mode=max) is the single
    # authoritative producer.
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}
    needs: [backend-lint, backend-tests, migration-smoke, backend-extended, frontend-check, e2e-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build admin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/admin.Dockerfile
          push: false
          tags: novelai/admin:ci
          cache-from: type=gha,scope=admin

      - name: Build reader image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/reader.Dockerfile
          push: false
          tags: novelai/reader:ci
          cache-from: type=gha,scope=reader

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/frontend.Dockerfile
          push: false
          tags: novelai/frontend:ci
          cache-from: type=gha,scope=frontend

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'backend/src/**'
              - 'backend/tests/e2e/**'
              - 'backend/tests/fixtures/e2e/**'
              - 'backend/tests/conftest.py'
              - 'backend/alembic/**'
              - 'backend/sql/**'

      - if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - if: steps.filter.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@1edb52594c857e2b5b13128931090f0640537287 # v5.3.0
        with:
          version: "0.12.0"
          enable-cache: true

      - if: steps.filter.outputs.relevant == 'true'
        run: >-
          uv sync --locked --extra documents --extra gemini --extra dev
          --extra test --extra s3 --extra auth

      - if: steps.filter.outputs.relevant == 'true'
        run: >-
          uv run --locked pytest --basetemp=backend/tests/.tmp/pytest-e2e
          -m e2e --tb=short -q
