name: Production External Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-external-monitor
  cancel-in-progress: false

jobs:
  public-health-and-seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # Repository variable (not secret): set PRODUCTION_MONITOR_ENABLED=true
    # only once a real production domain exists, so the scheduled run does
    # not allocate runners to announce a missing secret.
    if: ${{ vars.PRODUCTION_MONITOR_ENABLED == 'true' }}
    env:
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify production domain configuration
        run: |
          if [ -z "$PRODUCTION_BASE_URL" ]; then
            echo "::error::PRODUCTION_MONITOR_ENABLED is true but PRODUCTION_BASE_URL repository variable is empty."
            exit 1
          fi

      - name: Run external public smoke checks
        shell: pwsh
        run: |
          & "deploy/scripts/deploy-smoke.ps1" -BaseUrl $env:PRODUCTION_BASE_URL -ExternalMonitor -TimeoutSeconds 10
