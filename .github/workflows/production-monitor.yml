name: Production External Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-health-and-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-external-monitor
      cancel-in-progress: true
    # No domain yet: the secret is unset, so the job is skipped instead of
    # failing red every five minutes. Set PRODUCTION_BASE_URL once a
    # production domain exists.
    if: ${{ secrets.PRODUCTION_BASE_URL != '' }}
    env:
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run external public smoke checks
        shell: pwsh
        run: |
          & "deploy/scripts/deploy-smoke.ps1" -BaseUrl $env:PRODUCTION_BASE_URL -ExternalMonitor
