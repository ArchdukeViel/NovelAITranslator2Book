name: R2 Worker Integration

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions: {}

concurrency:
  group: r2-worker-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  r2-worker-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.8.1"
          cache: npm
          cache-dependency-path: workers/r2-gateway/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Install Worker dependencies
        working-directory: workers/r2-gateway
        run: npm ci --ignore-scripts

      - name: Run native binding tests
        working-directory: workers/r2-gateway
        run: npm run test:bindings

      - name: Run gateway contract tests
        working-directory: workers/r2-gateway
        run: npm test

      - name: Typecheck Worker
        working-directory: workers/r2-gateway
        run: npm run typecheck

      - name: Validate test deployment without deploying
        working-directory: workers/r2-gateway
        run: npm run deploy:dry-run

      - name: Install locked backend test tooling
        run: uv sync --locked --extra dev --extra test

      - name: Run backend gateway contract tests
        run: >-
          uv run --locked pytest -q
          backend/tests/test_storage_backends.py
          backend/tests/test_r2_content_addressing.py
