name: Build and Push

on:
  # The same-repository, default-branch, successful-push guards below prevent
  # untrusted workflow_run payloads from receiving publication permissions.
  # zizmor: ignore[dangerous-triggers] -- intentionally guarded publisher.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: build-push-default-branch
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      matrix:
        include:
          - service: admin
            dockerfile: deploy/admin.Dockerfile
            image: novelai-admin
          - service: reader
            dockerfile: deploy/reader.Dockerfile
            image: novelai-reader
          - service: frontend
            dockerfile: deploy/frontend.Dockerfile
            image: novelai-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == github.event.repository.default_branch }}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Run vulnerability scan on the built image digest before provenance.
      - name: Resolve lowercase image reference
        id: image-ref
        env:
          REPOSITORY: ${{ github.repository }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/${REPOSITORY,,}/${IMAGE}"
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "ref=$IMAGE_NAME@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image-ref.outputs.ref }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # GitHub artifact attestations are unavailable for user-owned private
      # repositories. Use Sigstore keyless provenance in the GHCR OCI referrer
      # graph instead; the exact workflow identity is verified before deploy.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create and verify image provenance
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image-ref.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/build.yml@refs/heads/main
          CERTIFICATE_OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail

          PREDICATE_TYPE="https://slsa.dev/provenance/v1"
          PREDICATE="$(mktemp)"
          trap 'rm -f "$PREDICATE"' EXIT

          jq -n \
            --arg repository "$REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg dockerfile "$DOCKERFILE" \
            --arg workflow_ref "$WORKFLOW_REF" \
            --arg run_id "$RUN_ID" \
            '{
              buildDefinition: {
                buildType: "https://github.com/Attestations/GitHubActionsWorkflow@v1",
                externalParameters: {
                  source: {
                    uri: ("git+https://github.com/" + $repository + ".git"),
                    digest: {sha1: $source_sha},
                    entryPoint: $dockerfile
                  }
                },
                internalParameters: {
                  github: {
                    repository: $repository,
                    workflowRef: $workflow_ref,
                    runId: $run_id
                  }
                },
                resolvedDependencies: []
              },
              runDetails: {
                builder: {id: "https://github.com/actions/runner"}
              }
            }' > "$PREDICATE"

          IMAGE_REF="${IMAGE_NAME}@${IMAGE_DIGEST}"
          cosign attest --yes --type "$PREDICATE_TYPE" --predicate "$PREDICATE" "$IMAGE_REF"
          cosign verify-attestation \
            --type "$PREDICATE_TYPE" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$CERTIFICATE_OIDC_ISSUER" \
            "$IMAGE_REF" >/dev/null

  # A failed publication must not leave a misleading green workflow.
  build-done:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: >-
      ${{
        !cancelled() &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    permissions: {}
    steps:
      - name: Require successful image publication
        env:
          BUILD_RESULT: ${{ needs.build-and-push.result }}
        run: |
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "Image publication did not succeed: $BUILD_RESULT"
            exit 1
          fi
          echo "All images were published successfully."
