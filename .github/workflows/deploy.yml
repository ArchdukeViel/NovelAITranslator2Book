name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published image tag to deploy (latest or sha-<full commit SHA>)"
        required: true
        default: "latest"
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
permissions: {}

jobs:
  # Production deployments first verify hosted PostgreSQL and R2 integration
  # against the live managed services; the deployment is blocked if the
  # verification fails. Skipped for staging (a skipped needed job is treated
  # as success, so staging deployments proceed).
  managed-services-check:
    if: ${{ inputs.environment == 'production' }}
    uses: ./.github/workflows/managed-services-verification.yml
    with:
      required: true
    secrets: inherit

  deploy:
    runs-on: ubuntu-latest
    needs: managed-services-check
    environment: >-
      ${{
        github.event_name == 'push' && 'production' ||
        inputs.environment || 'production'
      }}
    # Deploy credentials are environment-scoped, never repo-level, so a
    # workflow running on a fork or a lower-trust context cannot read them.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

    steps:
      - name: Determine version
        id: version
        run: |
          echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "Manual deployment requested for image tag: ${{ inputs.version }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/novelai

            # Write the requested version into the env file so compose picks it up
            export VERSION="${{ steps.version.outputs.value }}"
            echo "Deploying version: $VERSION to ${{ github.event.inputs.environment || 'production' }}"

            # Pull the exact image tags being deployed
            docker compose pull

            # Migrations must succeed before application containers start.
            docker compose run --rm migrate

            # Bring up the requested immutable application images.
            docker compose up -d --remove-orphans --pull always

            # Prune dangling images older than 24h to reclaim disk
            docker image prune -f --filter "until=24h"

            echo "Deploy complete."
