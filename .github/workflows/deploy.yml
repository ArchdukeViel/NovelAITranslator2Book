name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published image tag to deploy (latest or sha-<full commit SHA>)"
        required: true
        default: "latest"
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
permissions: {}

# Only one deployment per environment at a time, and never cancel a
# deployment that is mid-migration or compose start (cancel-in-progress:
# false). A newer deployment waits for the current one to finish.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # Production deployments first verify hosted PostgreSQL and R2 integration
  # against the live managed services; the deployment is blocked if the
  # verification fails. Skipped for staging.
  managed-services-check:
    if: ${{ inputs.environment == 'production' }}
    uses: ./.github/workflows/managed-services-verification.yml
    with:
      required: true
    secrets: inherit

  deploy:
    needs: managed-services-check
    if: >-
      ${{
        !cancelled() &&
        (
          inputs.environment != 'production' ||
          needs.managed-services-check.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    # Deploy credentials are environment-scoped, never repo-level, so a
    # workflow running on a fork or a lower-trust context cannot read them.
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      VERSION: ${{ inputs.version }}
      DEPLOY_ENV: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub resolves "${{ ... }}" before the shell runs, so interpolating
      # the free-form version input into a script is injection-prone. Validate
      # it first, then pass the value to the remote script only through
      # environment variables.
      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENV" == "production" ]]; then
            # Production deploys immutable image tags: full-SHA only.
            if [[ ! "$VERSION" =~ ^sha-[0-9a-f]{40}$ ]]; then
              echo "::error::Production requires version=sha-<40 lowercase hex>; got '$VERSION'"
              exit 1
            fi
          else
            if [[ "$VERSION" != "latest" && ! "$VERSION" =~ ^sha-[0-9a-f]{40}$ ]]; then
              echo "::error::Version must be 'latest' or sha-<40 lowercase hex>; got '$VERSION'"
              exit 1
            fi
          fi
          echo "Validated version: $VERSION (environment: $DEPLOY_ENV)"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          envs: VERSION,DEPLOY_ENV
          script: |
            set -euo pipefail
            cd /opt/novelai

            echo "Deploying version: $VERSION to $DEPLOY_ENV"

            # Pull the exact image tags being deployed
            docker compose pull

            # Migrations must succeed before application containers start.
            docker compose run --rm migrate

            # Bring up the requested immutable application images.
            docker compose up -d --remove-orphans --pull always

            # Prune dangling images older than 24h to reclaim disk
            docker image prune -f --filter "until=24h"

            echo "Deploy complete."

      # Deployment reports success only after the post-deploy smoke gate
      # passes. Production smoke is fail-closed: if the acceptance secrets
      # are not configured the deployment is reported as failed rather than
      # leaving an unverified production state.
      - name: Smoke test production deployment
        if: inputs.environment == 'production'
        shell: pwsh
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          NOVELAI_SMOKE_SESSION_COOKIE: ${{ secrets.NOVELAI_SMOKE_SESSION_COOKIE }}
        run: |
          if (-not $env:PRODUCTION_BASE_URL -or -not $env:NOVELAI_SMOKE_SESSION_COOKIE) {
            Write-Error "Production smoke gate requires PRODUCTION_BASE_URL repository variable and NOVELAI_SMOKE_SESSION_COOKIE secret."
            exit 1
          }
          & "deploy/scripts/deploy-smoke.ps1" -BaseUrl $env:PRODUCTION_BASE_URL -Production
