name: Managed Services Recovery Verification

on:
  workflow_dispatch:
    inputs:
      confirm_test_recovery:
        description: "Confirm disposable testdatabase=dokushodo and test R2 buckets only"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      confirm_test_recovery:
        description: "Confirm disposable testdatabase=dokushodo and test R2 buckets only"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: managed-test-recovery
  cancel-in-progress: false

jobs:
  isolated-managed-recovery:
    if: ${{ inputs.confirm_test_recovery == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore-db:
        image: postgres:18.6-alpine@sha256:432b3b824c0769275ec9b0947736ef8b376d6997bcaa9de29818f613819c2feb
        env:
          POSTGRES_USER: novelai_restore
          POSTGRES_DB: novelai_restore_verify
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelai_restore -d novelai_restore_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MANAGED_DATABASE_TEST_URL: ${{ secrets.MANAGED_DATABASE_TEST_URL }}
      DATABASE_URL: ${{ secrets.MANAGED_DATABASE_TEST_URL }}
      DATABASE_RESTORE_TARGET_URL: postgresql+psycopg://novelai_restore@127.0.0.1:5432/novelai_restore_verify
      TEST_R2_ENDPOINT: ${{ secrets.TEST_R2_ENDPOINT }}
      TEST_R2_TARGET_BUCKET: ${{ vars.TEST_R2_TARGET_BUCKET }}
      TEST_R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.TEST_R2_BACKUP_ACCESS_KEY_ID }}
      TEST_R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_BACKUP_SECRET_ACCESS_KEY }}
      TEST_R2_REGION: auto
      DATABASE_BACKUP_ENABLED: "true"
      DATABASE_BACKUP_PREFIX: recovery-${{ github.run_id }}
      DATABASE_BACKUP_MIN_SUCCESSFUL_TO_KEEP: "1"
      DATABASE_BACKUP_RETENTION_DAYS: "30"
      DATABASE_RESTORE_SSL_MODE: disable
      RECOVERY_EVIDENCE_PATH: ${{ github.workspace }}/managed-database-recovery-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - run: pip install "uv==0.12.0"
      - run: >-
          uv sync --locked --extra dev --extra test --extra s3 --extra auth
      - name: Prepare pinned PostgreSQL 17 client container
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/pg17-client" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          tool_name="$(basename "$0")"
          docker_args=(
            --rm
            --network host
            --env PGHOST
            --env PGPORT
            --env PGDATABASE
            --env PGUSER
            --env PGPASSWORD
            --env PGSSLMODE
          )
          tool_args=("$@")
          if [[ "$tool_name" == "pg_restore" && ${#tool_args[@]} -gt 1 ]]; then
            archive_index=$((${#tool_args[@]} - 1))
            archive_path="${tool_args[$archive_index]}"
            archive_directory="$(dirname "$archive_path")"
            archive_name="$(basename "$archive_path")"
            tool_args[$archive_index]="/pgrestore/$archive_name"
            docker_args+=(--volume "${archive_directory}:/pgrestore:ro")
          fi
          docker_args+=(postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94)
          if [[ "$tool_name" == "pg_restore" && -n "${PG_RESTORE_DIAGNOSTIC_PATH:-}" ]]; then
            raw_path="${PG_RESTORE_DIAGNOSTIC_PATH}.raw"
            set +e
            docker run "${docker_args[@]}" "$tool_name" "${tool_args[@]}" 2>"$raw_path"
            exit_code=$?
            set -e
            classification="success"
            if [[ "$exit_code" -ne 0 ]]; then
              classification="unclassified"
              if grep -Eqi "could not open input file|no such file or directory|cannot open" "$raw_path"; then
                classification="input_file"
              elif grep -Eqi "server version|client version" "$raw_path"; then
                classification="version_mismatch"
              elif grep -Eqi "could not connect|connection refused|connection.*failed|no route" "$raw_path"; then
                classification="connection"
              elif grep -Eqi "permission denied|must be owner|not owner|permission" "$raw_path"; then
                classification="permission"
              elif grep -Eqi "schema .* does not exist" "$raw_path"; then
                classification="missing_schema"
              elif grep -Eqi "relation .* does not exist|table .* does not exist" "$raw_path"; then
                classification="missing_relation"
              elif grep -Eqi "function .* does not exist" "$raw_path"; then
                classification="missing_function"
              elif grep -Eqi "type .* does not exist" "$raw_path"; then
                classification="missing_type"
              elif grep -Eqi "role .* does not exist" "$raw_path"; then
                classification="missing_role"
              elif grep -Eqi "extension .* (does not exist|is not available)" "$raw_path"; then
                classification="missing_extension"
              elif grep -Eqi "does not exist|undefined|not found" "$raw_path"; then
                classification="missing_object"
              elif grep -Eqi "already exists|duplicate" "$raw_path"; then
                classification="object_conflict"
              elif grep -Eqi "syntax error|fatal|error" "$raw_path"; then
                classification="pg_restore_error"
              fi
            fi
            printf '%s\n' "$classification" > "$PG_RESTORE_DIAGNOSTIC_PATH"
            rm -f "$raw_path"
            exit "$exit_code"
          fi
          exec docker run "${docker_args[@]}" "$tool_name" "${tool_args[@]}"
          EOF
          chmod 700 "$RUNNER_TEMP/pg17-client"
          ln -s "$RUNNER_TEMP/pg17-client" "$RUNNER_TEMP/pg_dump"
          ln -s "$RUNNER_TEMP/pg17-client" "$RUNNER_TEMP/pg_restore"
          echo "PG_DUMP_PATH=$RUNNER_TEMP/pg_dump" >> "$GITHUB_ENV"
          echo "PG_RESTORE_PATH=$RUNNER_TEMP/pg_restore" >> "$GITHUB_ENV"
          echo "PG_RESTORE_DIAGNOSTIC_PATH=$RUNNER_TEMP/pg_restore_diagnostic_class" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pg_dump" --version
          "$RUNNER_TEMP/pg_restore" --version
      - name: Generate ephemeral backup encryption key
        run: |
          set -euo pipefail
          BACKUP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$BACKUP_KEY"
          printf 'DATABASE_BACKUP_ENCRYPTION_KEY=%s\n' "$BACKUP_KEY" >> "$GITHUB_ENV"
      - name: Verify managed backup and isolated restore
        run: >-
          uv run --locked pytest -q -m integration
          backend/tests/integration/test_managed_database_recovery.py
      - name: Publish sanitized recovery evidence
        if: always()
        run: |
          if [ -f "$RECOVERY_EVIDENCE_PATH" ]; then
            cat "$RECOVERY_EVIDENCE_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Recovery evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: managed-database-recovery-evidence-${{ github.run_id }}
          path: ${{ env.RECOVERY_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 14
