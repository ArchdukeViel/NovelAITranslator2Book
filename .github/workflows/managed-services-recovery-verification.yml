name: Managed Services Recovery Verification

on:
  workflow_dispatch:
    inputs:
      confirm_test_recovery:
        description: "Confirm disposable testdatabase=dokushodo and test R2 buckets only"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: managed-test-recovery
  cancel-in-progress: false

jobs:
  isolated-managed-recovery:
    if: ${{ inputs.confirm_test_recovery == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      restore-db:
        image: postgres:18.6-alpine@sha256:432b3b824c0769275ec9b0947736ef8b376d6997bcaa9de29818f613819c2feb
        env:
          POSTGRES_USER: novelai_restore
          POSTGRES_DB: novelai_restore_verify
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novelai_restore -d novelai_restore_verify"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MANAGED_DATABASE_TEST_URL: ${{ secrets.MANAGED_DATABASE_TEST_URL }}
      DATABASE_URL: ${{ secrets.MANAGED_DATABASE_TEST_URL }}
      DATABASE_RESTORE_TARGET_URL: postgresql+psycopg://novelai_restore@127.0.0.1:5432/novelai_restore_verify
      TEST_R2_ENDPOINT: ${{ secrets.TEST_R2_ENDPOINT }}
      TEST_R2_TARGET_BUCKET: ${{ vars.TEST_R2_TARGET_BUCKET }}
      TEST_R2_BACKUP_ACCESS_KEY_ID: ${{ secrets.TEST_R2_BACKUP_ACCESS_KEY_ID }}
      TEST_R2_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.TEST_R2_BACKUP_SECRET_ACCESS_KEY }}
      TEST_R2_REGION: auto
      DATABASE_BACKUP_ENABLED: "true"
      DATABASE_BACKUP_PREFIX: recovery-${{ github.run_id }}
      DATABASE_BACKUP_MIN_SUCCESSFUL_TO_KEEP: "1"
      DATABASE_BACKUP_RETENTION_DAYS: "30"
      DATABASE_RESTORE_SSL_MODE: disable
      RECOVERY_EVIDENCE_PATH: ${{ github.workspace }}/managed-database-recovery-evidence.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"
      - run: pip install "uv==0.12.0"
      - run: >-
          uv sync --locked --extra dev --extra test --extra s3 --extra auth
      - name: Ensure PostgreSQL client tools are available
        run: |
          if ! command -v pg_dump >/dev/null 2>&1 || ! command -v pg_restore >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          pg_dump --version
          pg_restore --version
      - name: Generate ephemeral backup encryption key
        run: |
          set -euo pipefail
          printf 'DATABASE_BACKUP_ENCRYPTION_KEY=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Verify managed backup and isolated restore
        run: >-
          uv run --locked pytest -q -m integration
          backend/tests/integration/test_managed_database_recovery.py
      - name: Publish sanitized recovery evidence
        if: always()
        run: |
          if [ -f "$RECOVERY_EVIDENCE_PATH" ]; then
            cat "$RECOVERY_EVIDENCE_PATH" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Recovery evidence file was not produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: managed-database-recovery-evidence-${{ github.run_id }}
          path: ${{ env.RECOVERY_EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 14
