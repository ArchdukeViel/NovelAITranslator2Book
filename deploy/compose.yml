name: novel-ai

services:
  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novelai-net
    restart: unless-stopped
    stop_grace_period: 30s

  db:
    image: postgres:17.4-alpine
    restart: unless-stopped
    container_name: dokushodo-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dokushodo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dokushodo}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: >-
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
        -c wal_level=replica
        -c checkpoint_completion_target=0.9
        -c autovacuum_vacuum_scale_factor=0.05
        -c autovacuum_analyze_scale_factor=0.02
        -c log_min_duration_statement=250
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dokushodo} -d ${POSTGRES_DB:-dokushodo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks:
      - novelai-net
    stop_grace_period: 30s

  cloudbeaver:
    image: dbeaver/cloudbeaver:24.3.0
    container_name: dokushodo-cloudbeaver
    restart: unless-stopped
    ports:
      - "${CLOUDBEAVER_BIND_ADDRESS:-127.0.0.1}:${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - novelai-net
    depends_on:
      db:
        condition: service_healthy

  restore-db:
    image: postgres:18.6-alpine@sha256:432b3b824c0769275ec9b0947736ef8b376d6997bcaa9de29818f613819c2feb
    profiles:
      - recovery
    environment:
      POSTGRES_USER: novelai_restore
      POSTGRES_PASSWORD: ${DATABASE_RESTORE_PASSWORD}
      POSTGRES_DB: novelai_restore_verify
    volumes:
      - restore_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelai_restore -d novelai_restore_verify"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - novelai-net
    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    depends_on:
      backend:
        condition: service_healthy
      reader:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${PUBLIC_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_HTTP_PORT:-80}:80"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header='Host: ${SITE_DOMAIN:-localhost}' http://127.0.0.1/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - novelai-net
    restart: unless-stopped
    stop_grace_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:2026.8.0@sha256:2535e54b16adf1d50630f99d0886471926c5ef3f6b328100ec6589f731c48969
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/secrets/cloudflare_tunnel_token"]
    depends_on:
      caddy:
        condition: service_healthy
    secrets:
      - cloudflare_tunnel_token
    networks:
      - novelai-net
    restart: unless-stopped
    stop_grace_period: 30s

  frontend:
    # Local-only fallback; release.env overrides this with a digest-pinned image.
    image: ${FRONTEND_IMAGE:-novelai-frontend:local}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: /api
      BACKEND_API_URL: http://backend:8000
      READER_API_URL: http://reader:8001
      BACKEND_API_HOST: ${BACKEND_API_HOST:-${SITE_DOMAIN:-localhost}}
    depends_on:
      reader:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - novelai-net
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    image: ${ADMIN_IMAGE:-novelai-admin:local}
    profiles:
      - migration
    user: root
    working_dir: /app/backend
    entrypoint: ["alembic", "-c", "/app/backend/alembic.ini", "upgrade", "head"]
    environment:
      - DATABASE_URL=${MIGRATION_DATABASE_URL:-${DATABASE_URL:?Set DATABASE_URL}}
      - DB_CONNECTION_MODE=${DB_CONNECTION_MODE:-direct}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_PROCESS_COUNT=${DB_POOL_PROCESS_COUNT:-3}
      - DB_CONNECTION_RESERVE=${DB_CONNECTION_RESERVE:-2}
      - DB_CONNECTION_BUDGET=${DB_CONNECTION_BUDGET:-32}
      - DB_POOL_TIMEOUT_SECONDS=${DB_POOL_TIMEOUT_SECONDS:-30}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-10}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-120000}
      - DB_LOCK_TIMEOUT_MS=${DB_LOCK_TIMEOUT_MS:-10000}
      - DB_IDLE_IN_TRANSACTION_TIMEOUT_MS=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      - PROVIDER_CREDENTIAL_ENCRYPTION_KEY=${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
    networks:
      - novelai-net
    restart: "no"

  backend:
    # Local-only fallback; release.env overrides this with a digest-pinned image.
    image: ${ADMIN_IMAGE:-novelai-admin:local}
    networks:
      - novelai-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/live', headers={'Host': '${SITE_DOMAIN:-localhost}'})).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    env_file:
      - ./.env
    environment:
      - ENV=${ENV:-production}
      - SERVICE_ROLE=admin
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - WEB_API_KEY
      - WEB_CORS_ORIGINS=${WEB_CORS_ORIGINS:-}
      - WEB_RATE_LIMITER_BACKEND=${WEB_RATE_LIMITER_BACKEND:-redis}
      - WEB_REQUEST_TIMEOUT_SECONDS=${WEB_REQUEST_TIMEOUT_SECONDS:-120}
      - JOB_WORKER_ENABLED=false
      - JOB_WORKER_POLL_SECONDS=${JOB_WORKER_POLL_SECONDS:-3}
      - RUNTIME_TELEMETRY_SAMPLE_INTERVAL_SECONDS=${RUNTIME_TELEMETRY_SAMPLE_INTERVAL_SECONDS:-0.25}
      - RUNTIME_TELEMETRY_MAX_OBSERVATIONS=${RUNTIME_TELEMETRY_MAX_OBSERVATIONS:-256}
      - RUNTIME_EVENT_LOOP_LAG_THRESHOLD_MS=${RUNTIME_EVENT_LOOP_LAG_THRESHOLD_MS:-1000}
      - RUNTIME_DIR=/app/data/runtime
      - PROVIDER_DEFAULT=${PROVIDER_DEFAULT:-gemini}
      - PROVIDER_GEMINI_API_KEY
      - PROVIDER_CREDENTIAL_ENCRYPTION_KEY=${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
      - TRANSLATION_TARGET_LANGUAGE=${TRANSLATION_TARGET_LANGUAGE:-English}
      - TRANSLATION_PERSISTENCE_EXPANSION_ENABLED=${TRANSLATION_PERSISTENCE_EXPANSION_ENABLED:-false}
      - TRANSLATION_PERSISTENCE_WORKERS=${TRANSLATION_PERSISTENCE_WORKERS:-2}
      - TRANSLATION_PERSISTENCE_QUEUE_SIZE=${TRANSLATION_PERSISTENCE_QUEUE_SIZE:-8}
      - TRANSLATION_PERSISTENCE_OBSERVATION_LIMIT=${TRANSLATION_PERSISTENCE_OBSERVATION_LIMIT:-256}
      - TRANSLATION_PERSISTENCE_SHUTDOWN_TIMEOUT_SECONDS=${TRANSLATION_PERSISTENCE_SHUTDOWN_TIMEOUT_SECONDS:-30}
      - R2_BUCKET=${R2_BUCKET:-dokushodo}
      - R2_GATEWAY_URL=${R2_GATEWAY_URL:-}
      - R2_GATEWAY_CLIENT_ID=${R2_GATEWAY_CLIENT_ID:-}
      - R2_GATEWAY_CLIENT_SECRET=${R2_GATEWAY_CLIENT_SECRET:-}
      - R2_STORAGE_LIMIT_GB=${R2_STORAGE_LIMIT_GB:-9.5}
      - R2_BACKUP_ENABLED=${R2_BACKUP_ENABLED:-false}
      - R2_BACKUP_BUCKET=${R2_BACKUP_BUCKET:-dokushodo-backup}
      - R2_RECOVERY_GATEWAY_URL=${R2_RECOVERY_GATEWAY_URL:-}
      - R2_RECOVERY_CLIENT_ID=${R2_RECOVERY_CLIENT_ID:-}
      - R2_RECOVERY_CLIENT_SECRET=${R2_RECOVERY_CLIENT_SECRET:-}
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY}
      - OWNER_BOOTSTRAP_SECRET=${OWNER_BOOTSTRAP_SECRET:?Set OWNER_BOOTSTRAP_SECRET}
      - PUBLIC_FRONTEND_URL=${PUBLIC_FRONTEND_URL:?Set PUBLIC_FRONTEND_URL to the public frontend origin}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - AUTH_EMAIL_DELIVERY_MODE=${AUTH_EMAIL_DELIVERY_MODE:-noop}
      - AUTH_PASSWORD_RESET_PATH=${AUTH_PASSWORD_RESET_PATH:-/password/reset}
      - AUTH_EMAIL_VERIFICATION_PATH=${AUTH_EMAIL_VERIFICATION_PATH:-/email/verify}
      - SMTP_HOST
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Dokushodo}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_TIMEOUT_SECONDS=${SMTP_TIMEOUT_SECONDS:-10}
      - GOOGLE_OAUTH_CLIENT_ID
      - GOOGLE_OAUTH_CLIENT_SECRET
      - GOOGLE_OAUTH_REDIRECT_URI
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DB_CONNECTION_MODE=${DB_CONNECTION_MODE:-direct}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_PROCESS_COUNT=${DB_POOL_PROCESS_COUNT:-3}
      - DB_CONNECTION_RESERVE=${DB_CONNECTION_RESERVE:-2}
      - DB_CONNECTION_BUDGET=${DB_CONNECTION_BUDGET:-32}
      - DB_POOL_TIMEOUT_SECONDS=${DB_POOL_TIMEOUT_SECONDS:-30}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-10}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-120000}
      - DB_LOCK_TIMEOUT_MS=${DB_LOCK_TIMEOUT_MS:-10000}
      - DB_IDLE_IN_TRANSACTION_TIMEOUT_MS=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      - REDIS_URL=redis://redis:6379/0
      # M2a: Health probe settings
      - HEALTH_PROBE_TIMEOUT_MS=${HEALTH_PROBE_TIMEOUT_MS:-1000}
      - HEALTH_TOTAL_TIMEOUT_MS=${HEALTH_TOTAL_TIMEOUT_MS:-3000}
      - HEALTH_CACHE_TTL_SECONDS=${HEALTH_CACHE_TTL_SECONDS:-5}
      - HEALTH_DISK_WARNING_FREE_PERCENT=${HEALTH_DISK_WARNING_FREE_PERCENT:-15}
      - HEALTH_DISK_CRITICAL_FREE_PERCENT=${HEALTH_DISK_CRITICAL_FREE_PERCENT:-5}
      # Public read/analytics cache settings
      - PUBLIC_PROJECTION_CACHE_ENABLED=${PUBLIC_PROJECTION_CACHE_ENABLED:-true}
      - PUBLIC_PROJECTION_CACHE_TTL_SECONDS=${PUBLIC_PROJECTION_CACHE_TTL_SECONDS:-30}
      - PUBLIC_PROJECTION_CACHE_MAX_ENTRIES=${PUBLIC_PROJECTION_CACHE_MAX_ENTRIES:-256}
      - ANALYTICS_ASYNC_QUEUE_SIZE=${ANALYTICS_ASYNC_QUEUE_SIZE:-1000}
      # M2c: Backup settings
      - BACKUP_ENABLED=${BACKUP_ENABLED:-false}
      - BACKUP_SCHEDULE_CRON=${BACKUP_SCHEDULE_CRON:-0 2 * * *}
      - BACKUP_RETENTION_COUNT=${BACKUP_RETENTION_COUNT:-5}
      - BACKUP_MIN_SUCCESSFUL_TO_KEEP=${BACKUP_MIN_SUCCESSFUL_TO_KEEP:-3}
      - BACKUP_MAX_AGE_DAYS=${BACKUP_MAX_AGE_DAYS:-30}
      - R2_BACKUP_PREFIX=${R2_BACKUP_PREFIX:-snapshots}
      - SCHEDULED_JOB_LEASE_SECONDS=${SCHEDULED_JOB_LEASE_SECONDS:-900}
      - DATABASE_BACKUP_ENABLED=${DATABASE_BACKUP_ENABLED:-false}
      - DATABASE_BACKUP_SCHEDULE_CRON=${DATABASE_BACKUP_SCHEDULE_CRON:-0 1 * * *}
      - DATABASE_BACKUP_TIMEZONE=${DATABASE_BACKUP_TIMEZONE:-UTC}
      - DATABASE_BACKUP_PREFIX=${DATABASE_BACKUP_PREFIX:-database}
      - DATABASE_BACKUP_RETENTION_DAYS=${DATABASE_BACKUP_RETENTION_DAYS:-30}
      - DATABASE_BACKUP_MIN_SUCCESSFUL_TO_KEEP=${DATABASE_BACKUP_MIN_SUCCESSFUL_TO_KEEP:-3}
      - DATABASE_BACKUP_ENCRYPTION_KEY=${DATABASE_BACKUP_ENCRYPTION_KEY:-}
      - DATABASE_BACKUP_URL=${DATABASE_BACKUP_URL:-}
      - DATABASE_RESTORE_VERIFICATION_ENABLED=${DATABASE_RESTORE_VERIFICATION_ENABLED:-false}
      - DATABASE_RESTORE_VERIFICATION_SCHEDULE_CRON=${DATABASE_RESTORE_VERIFICATION_SCHEDULE_CRON:-0 3 1 * *}
      - DATABASE_RESTORE_VERIFICATION_TIMEZONE=${DATABASE_RESTORE_VERIFICATION_TIMEZONE:-UTC}
      - DATABASE_RESTORE_TARGET_URL=${DATABASE_RESTORE_TARGET_URL:-}
      - DATABASE_RESTORE_SSL_MODE=${DATABASE_RESTORE_SSL_MODE:-require}
      - OPERATOR_ALERT_ENABLED=${OPERATOR_ALERT_ENABLED:-false}
      - OPERATOR_ALERT_EMAIL=${OPERATOR_ALERT_EMAIL:-}
      - OPERATOR_ALERT_FAILURE_THRESHOLD=${OPERATOR_ALERT_FAILURE_THRESHOLD:-3}
      - OPERATOR_ALERT_COOLDOWN_SECONDS=${OPERATOR_ALERT_COOLDOWN_SECONDS:-3600}
      - OPERATOR_ALERT_STALE_BACKUP_HOURS=${OPERATOR_ALERT_STALE_BACKUP_HOURS:-36}
      # M2c: Maintenance cleanup settings
      - MAINTENANCE_ENABLED=${MAINTENANCE_ENABLED:-false}
      - MAINTENANCE_DRY_RUN=${MAINTENANCE_DRY_RUN:-false}
      - MAINTENANCE_ACTIVITY_RETENTION_DAYS=${MAINTENANCE_ACTIVITY_RETENTION_DAYS:-90}
      - MAINTENANCE_FETCH_CACHE_MAX_AGE_HOURS=${MAINTENANCE_FETCH_CACHE_MAX_AGE_HOURS:-24}
      - MAINTENANCE_PIPELINE_EVENTS_MAX_AGE_DAYS=${MAINTENANCE_PIPELINE_EVENTS_MAX_AGE_DAYS:-30}
    volumes:
      - ${RUNTIME_HOST_DIR:-/opt/novelai/shared/data/runtime}:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 60s

  worker:
    # The worker owns provider-backed crawl and translation execution. Keep
    # activity processing out of the public/admin web event loops.
    image: ${ADMIN_IMAGE:-novelai-admin:local}
    command: ["novelaibook", "worker"]
    env_file:
      - ./.env
    environment:
      - ENV=${ENV:-production}
      - SERVICE_ROLE=worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JOB_WORKER_ENABLED=false
      - JOB_WORKER_POLL_SECONDS=${JOB_WORKER_POLL_SECONDS:-3}
      - RUNTIME_TELEMETRY_SAMPLE_INTERVAL_SECONDS=${RUNTIME_TELEMETRY_SAMPLE_INTERVAL_SECONDS:-0.25}
      - RUNTIME_TELEMETRY_MAX_OBSERVATIONS=${RUNTIME_TELEMETRY_MAX_OBSERVATIONS:-256}
      - RUNTIME_EVENT_LOOP_LAG_THRESHOLD_MS=${RUNTIME_EVENT_LOOP_LAG_THRESHOLD_MS:-1000}
      - RUNTIME_DIR=/app/data/runtime
      - PROVIDER_DEFAULT=${PROVIDER_DEFAULT:-gemini}
      - PROVIDER_GEMINI_API_KEY
      - PROVIDER_CREDENTIAL_ENCRYPTION_KEY=${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:-}
      - TRANSLATION_TARGET_LANGUAGE=${TRANSLATION_TARGET_LANGUAGE:-English}
      - TRANSLATION_PERSISTENCE_EXPANSION_ENABLED=${TRANSLATION_PERSISTENCE_EXPANSION_ENABLED:-false}
      - TRANSLATION_PERSISTENCE_WORKERS=${TRANSLATION_PERSISTENCE_WORKERS:-2}
      - TRANSLATION_PERSISTENCE_QUEUE_SIZE=${TRANSLATION_PERSISTENCE_QUEUE_SIZE:-8}
      - TRANSLATION_PERSISTENCE_OBSERVATION_LIMIT=${TRANSLATION_PERSISTENCE_OBSERVATION_LIMIT:-256}
      - TRANSLATION_PERSISTENCE_SHUTDOWN_TIMEOUT_SECONDS=${TRANSLATION_PERSISTENCE_SHUTDOWN_TIMEOUT_SECONDS:-30}
      - R2_BUCKET=${R2_BUCKET:-dokushodo}
      - R2_GATEWAY_URL=${R2_GATEWAY_URL:-}
      - R2_GATEWAY_CLIENT_ID=${R2_GATEWAY_CLIENT_ID:-}
      - R2_GATEWAY_CLIENT_SECRET=${R2_GATEWAY_CLIENT_SECRET:-}
      - R2_STORAGE_LIMIT_GB=${R2_STORAGE_LIMIT_GB:-9.5}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DB_CONNECTION_MODE=${DB_CONNECTION_MODE:-direct}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_PROCESS_COUNT=${DB_POOL_PROCESS_COUNT:-3}
      - DB_CONNECTION_RESERVE=${DB_CONNECTION_RESERVE:-2}
      - DB_CONNECTION_BUDGET=${DB_CONNECTION_BUDGET:-32}
      - DB_POOL_TIMEOUT_SECONDS=${DB_POOL_TIMEOUT_SECONDS:-30}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-10}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-120000}
      - DB_LOCK_TIMEOUT_MS=${DB_LOCK_TIMEOUT_MS:-10000}
      - DB_IDLE_IN_TRANSACTION_TIMEOUT_MS=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ${RUNTIME_HOST_DIR:-/opt/novelai/shared/data/runtime}:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - novelai-net
    restart: unless-stopped
    stop_grace_period: 60s

  reader:
    # Local-only fallback; release.env overrides this with a digest-pinned image.
    image: ${READER_IMAGE:-novelai-reader:local}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8001/health/live', headers={'Host': '${SITE_DOMAIN:-localhost}'})).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    env_file:
      - ./.env
    environment:
      - ENV=${ENV:-production}
      - SERVICE_ROLE=reader
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - JOB_WORKER_ENABLED=false
      - RUNTIME_TELEMETRY_SAMPLE_INTERVAL_SECONDS=${RUNTIME_TELEMETRY_SAMPLE_INTERVAL_SECONDS:-0.25}
      - RUNTIME_TELEMETRY_MAX_OBSERVATIONS=${RUNTIME_TELEMETRY_MAX_OBSERVATIONS:-256}
      - RUNTIME_EVENT_LOOP_LAG_THRESHOLD_MS=${RUNTIME_EVENT_LOOP_LAG_THRESHOLD_MS:-1000}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8001
      - WEB_CORS_ORIGINS=${WEB_CORS_ORIGINS:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - RUNTIME_DIR=/app/data/runtime
      - R2_BUCKET=${R2_BUCKET:-dokushodo}
      - R2_STORAGE_LIMIT_GB=${R2_STORAGE_LIMIT_GB:-9.5}
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - DB_CONNECTION_MODE=${DB_CONNECTION_MODE:-direct}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_PROCESS_COUNT=${DB_POOL_PROCESS_COUNT:-3}
      - DB_CONNECTION_RESERVE=${DB_CONNECTION_RESERVE:-2}
      - DB_CONNECTION_BUDGET=${DB_CONNECTION_BUDGET:-32}
      - DB_POOL_TIMEOUT_SECONDS=${DB_POOL_TIMEOUT_SECONDS:-30}
      - DB_POOL_RECYCLE_SECONDS=${DB_POOL_RECYCLE_SECONDS:-1800}
      - DB_CONNECT_TIMEOUT_SECONDS=${DB_CONNECT_TIMEOUT_SECONDS:-10}
      - DB_SSL_MODE=${DB_SSL_MODE:-require}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-120000}
      - DB_LOCK_TIMEOUT_MS=${DB_LOCK_TIMEOUT_MS:-10000}
      - DB_IDLE_IN_TRANSACTION_TIMEOUT_MS=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}
      - REDIS_URL=redis://redis:6379/0
      - HEALTH_PROBE_TIMEOUT_MS=${HEALTH_PROBE_TIMEOUT_MS:-1000}
      - HEALTH_TOTAL_TIMEOUT_MS=${HEALTH_TOTAL_TIMEOUT_MS:-3000}
      - HEALTH_CACHE_TTL_SECONDS=${HEALTH_CACHE_TTL_SECONDS:-5}
      - HEALTH_DISK_WARNING_FREE_PERCENT=${HEALTH_DISK_WARNING_FREE_PERCENT:-15}
      - HEALTH_DISK_CRITICAL_FREE_PERCENT=${HEALTH_DISK_CRITICAL_FREE_PERCENT:-5}
      - PUBLIC_PROJECTION_CACHE_ENABLED=${PUBLIC_PROJECTION_CACHE_ENABLED:-true}
      - PUBLIC_PROJECTION_CACHE_TTL_SECONDS=${PUBLIC_PROJECTION_CACHE_TTL_SECONDS:-30}
      - PUBLIC_PROJECTION_CACHE_MAX_ENTRIES=${PUBLIC_PROJECTION_CACHE_MAX_ENTRIES:-256}
      - ANALYTICS_ASYNC_QUEUE_SIZE=${ANALYTICS_ASYNC_QUEUE_SIZE:-1000}
    volumes:
      - ${RUNTIME_HOST_DIR:-/opt/novelai/shared/data/runtime}:/app/data/runtime
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - novelai-net
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  restore_db_data:
  postgres_data:
  cloudbeaver_data:

