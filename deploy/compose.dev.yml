# Development overrides for deploy/compose.yml
# Usage: docker compose -f compose.yml -f compose.dev.yml up -d
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    volumes:
      - ../backend/src:/app/backend/src
    # Uvicorn's Python 3.14 reload subprocess is not stable without a TTY in
    # Docker Desktop; use the canonical single-process command for acceptance.
    # Recreate this service after source changes.
    command: ["novelai", "web", "--host", "0.0.0.0", "--port", "8000"]

  migrate:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile

  reader:
    build:
      context: ..
      dockerfile: deploy/reader.Dockerfile

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    volumes:
      - ../frontend:/app/frontend
    environment:
      NODE_ENV: development
