{
  "server": {
    "serverPort": 8978,
    "serverURL": "http://127.0.0.1:8978",
    "rootURI": "/",
    "serviceURI": "/service",
    "expireSessionAfterPeriod": 1800000,
    "database": {
      "pool": {
        "min": 4,
        "max": 10
      }
    }
  },
  "app": {
    "anonymousAccessEnabled": false,
    "supportsCustomConnections": true,
    "enableReverseProxyAuth": false,
    "forwardProxy": false,
    "disabledDrivers": [],
    "resourceQuotas": {
      "dataExportFileSizeLimit": 10000000,
      "sqlResultSetRowsLimit": 1000,
      "sqlResultSetMemoryLimit": 20000000,
      "sqlTextSizeLimit": 10000000
    },
    "defaultSettings": {
      "core": {
        "user": {
          "defaultTheme": "dark"
        }
      },
      "plugin": {
        "sql-editor": {
          "autoSave": true
        }
      }
    }
  },
  "navigation": {
    "filters": [
      {
        "type": "schema",
        "include": ["public"],
        "exclude": ["auth", "private"]
      }
    ]
  }
}
